name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.9.7'
          python-version: '3.13'
          enable-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked dependencies
        run: uv sync --locked --extra workspace
      - name: Run Python tests
        run: .venv/bin/python -m pytest -q
      - name: Check Marimo apps
        run: .venv/bin/marimo check apps/student_workspace.py apps/chat_policy_comparison.py apps/notebook_replay.py apps/continuation_comparison.py apps/policy_comparison_setup.py apps/policy_simulation_lab.py apps/policy_cohort_lab.py
      - name: Check review navigation
        run: node tests/episode_review_navigation.cjs
