  <button class="mobile-menu bare" id="explorer-toggle" aria-label="Show or hide case explorer" aria-expanded="false">Cases</button><div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h7l2 3 2-3h7v14h-7l-2 2-2-2H3zM12 8v13"/></svg>Student lab</div>
  <div class="breadcrumb">DSC 10</div>
  <span class="prototype-note">Authored demo · Backend disconnected</span>
  <button id="reset" title="Reset all demo changes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/></svg> <span class="reset-label">Reset demo</span></button>
 </header>
 <aside class="explorer" aria-label="Case explorer">
  <div class="explorer-heading">Cases</div>
  <div class="searchbox"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></svg><label class="sr-only" for="search">Filter sample cases</label><input id="search" type="search" placeholder="Filter cases…" autocomplete="off"></div>
  <div class="case-list" id="cases"></div>
 </aside>
 <main class="workbench">
  <nav class="tabs" aria-label="Activity"><button data-mode="inspect">Inspect</button><button data-mode="simulate">Simulate</button><button data-mode="compare">Compare</button><button class="inspector-toggle" id="inspector-toggle" hidden>Close details</button></nav>
  <div class="body-grid" id="body-grid">
   <section class="main" aria-label="Selected case">
    <header class="view-head"><div><h1 id="case-title"></h1><p id="view-description"></p></div><div class="head-buttons"><button id="instructions">Tutor instructions</button><button class="primary" id="next-step" hidden>Next demo step</button></div></header>
    <div class="canvas" id="canvas"></div>
    <section class="trail" id="playback" aria-label="Notebook playback"><div class="trail-label"><b id="trail-title"></b><span id="trail-hint"></span><button class="text-action" data-evidence="step">View step details</button></div><div class="trail-items" id="trail"></div></section>
   </section>
   <aside class="inspector" id="inspector" aria-label="Evidence inspector"></aside>
  </div>
 </main>
 <div id="status" class="sr-only" role="status" aria-live="polite">Ready</div>
</div>
<script>
'use strict';
// Entirely authored UI fixtures. None are course records or experiment results.
const cases = [
 {id:'01',title:'Filtering a table',topic:'Tables · help after an error',task:'Keep the walks longer than 20 minutes.',question:'why doesnt this work',before:'long_walks = walks["minutes" > 20]\nlong_walks',after:'long_walks = walks[walks["minutes"] > 20]\nlong_walks',tutor:'Look at what you are comparing with 20. You need the values in the minutes column, rather than the name of the column. Where would you select those values?',reference:'how do i select the column',baseline:'I see! I was comparing the column name instead of its values. I can select the column first and then filter the table.',grounded:'like walks["minutes"]?',history:['how do i get one column','why is this empty'],output:'3 matching rows',file:'table_filters.py'},
 {id:'02',title:'Calculating an average',topic:'Functions · checking an answer',task:'Write a function that returns the mean of a nonempty list.',question:'is this right',before:'def average(values):\n    return sum(values) / 2',after:'def average(values):\n    return sum(values) / len(values)',tutor:'Try your function on a list with three numbers. What should the denominator represent?',reference:'the number of values?',baseline:'The denominator should be the number of values. I will use len(values) instead of 2.',grounded:'the number of values?',history:['does this work','what goes here'],output:'average([2, 4, 9]) → 5.0',file:'averages.py'}
];
const defaultPolicy='Give one focused hint at a time. Refer to the student’s visible work. Ask a question when it helps them take the next step. Avoid assuming that a short message means the student is confused.';
const wideLayout=()=>window.matchMedia('(min-width:1001px)').matches;
const state={caseIndex:0,mode:'compare',selected:'context',step:2,inspector:'evidence',showInspector:false,draft:defaultPolicy,savedDraft:defaultPolicy};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h11l5 5v13H4zM14 3v6h6M8 13h8M8 17h5"/></svg>';
const check='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>';
const info='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 10v6M12 7h.01"/></svg>';
function current(){return cases[state.caseIndex]}
function notify(text){$('status').textContent=text}
function selectEvidence(key){state.selected=key;state.inspector='evidence';state.showInspector=true;render();notify('Inspecting '+({reference:'reference example',baseline:'generic baseline',grounded:'history-grounded example',context:'shared context',tutor:'tutor reply',step:'selected step'}[key]||key))}
function selectMode(mode){state.mode=mode;state.inspector='evidence';state.showInspector=false;state.selected=mode==='simulate'?'step':'context';render();notify(mode==='simulate'?'Authored playback; no code executes':mode==='compare'?'Illustrative comparison; not an evaluation result':'Inspecting authored source context')}
function renderCases(){const query=$('search').value.toLowerCase();const visible=cases.map((c,i)=>({c,i})).filter(({c})=>(c.title+' '+c.topic).toLowerCase().includes(query));$('cases').innerHTML=visible.map(({c,i})=>`<button class="case-button" data-case="${i}" aria-pressed="${state.caseIndex===i}">${icon}<span><b>${esc(c.title)}</b><small>Case ${c.id} · ${esc(c.topic.split(' · ')[0])}</small></span></button>`).join('')||'<p class="empty">No matching cases. Try “table” or “average”.</p>';document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>{state.caseIndex=Number(b.dataset.case);state.step=2;state.selected=state.mode==='simulate'?'step':'context';state.inspector='evidence';state.showInspector=false;$('app').classList.remove('show-explorer');$('explorer-toggle').setAttribute('aria-expanded','false');render();notify('Opened '+current().title)})}
function contextBox(c){return `<div class="context-box"><div class="context-title"><span>Before the next reply</span><button class="text-action" data-evidence="context">View context</button></div><div class="context-content"><div><h3>Student asks</h3><p>${esc(c.question)}</p><pre>${esc(c.before)}</pre></div><div><h3>Tutor reply <button class="text-action" data-evidence="tutor">Details</button></h3><p>${esc(c.tutor)}</p></div></div></div>`}
function renderCompare(c){const columns=[['reference','Reference example','Authored reference'],['baseline','Generic baseline','Course + current exchange'],['grounded','History-grounded','Same exchange + earlier messages']];return contextBox(c)+`<div class="section-label"><b>What happens next?</b></div><div class="compare-grid">`+columns.map(([key,title,subtitle])=>`<article class="comparison ${state.showInspector&&state.selected===key?'selected':''}"><header class="${key}-rule"><h2>${title}</h2><div class="kind">${subtitle}</div></header><div class="entry"><p>${esc(c[key])}</p></div><footer><button class="text-action" data-evidence="${key}" aria-pressed="${state.showInspector&&state.selected===key}">Inspect ${key==='reference'?'source':'inputs'}</button></footer></article>`).join('')+`</div><p class="note">${info}<span>Authored examples, not model outputs or measured improvements. A recorded reply would be one possible continuation.</span></p>`}
function chatTurn(role,text,key,withCode=''){return `<article class="chat-turn ${role==='Tutor'?'tutor':''} ${state.showInspector&&state.selected===key?'selected':''}"><header><span class="avatar ${role==='Tutor'?'tutor':''}">${role[0]}</span>${role}</header><p>${esc(text)}</p>${withCode?`<pre>${esc(withCode)}</pre>`:''}<button data-evidence="${key}">Inspect ${role==='Tutor'?'tutor context':'source'}</button></article>`}
function renderInspect(c){return `<div class="inspect-content"><div class="source-banner">${icon}<span><b>A conversation as the starting point</b><br><span class="muted">Authored example · no real student identity or notebook history</span></span></div><div class="section-label"><b>Earlier messages supplied to the grounded condition</b></div>`+c.history.map(t=>`<div class="chat-turn"><header><span class="avatar">S</span>Earlier student message </header><p>${esc(t)}</p></div>`).join('')+`<div class="section-label" style="margin-top:24px"><b>Current exchange</b></div>`+chatTurn('Student',c.question,'context',c.before)+chatTurn('Tutor',c.tutor,'tutor')+`<p class="note">${info}<span>A real dataset view would preserve the available context and explicitly mark missing notebook history. Code pasted into chat is not an observed notebook edit.</span></p></div>`}
const stepNames=['Starter code','Student asks','Tutor hints','Code changes','Check result'];
function renderSimulate(c){const source=state.step>=3?c.after:c.before;return `<div class="split-view"><section class="notebook" aria-label="Read-only notebook preview"><div class="pane-title">${icon}${esc(c.file)}<span class="spacer"></span><span class="muted small">Read only</span></div><div class="task"><b>Exercise</b><p>${esc(c.task)}</p></div><div class="cell"><div class="cell-head"><span>Python · cell 1</span><span>Revision ${state.step>=3?'1':'0'}</span></div>`+source.split('\n').map((line,i)=>`<div class="code-line"><span class="line-number">${i+1}</span><code>${esc(line)}</code></div>`).join('')+`</div>${state.step===4?`<div class="output"><b>Illustrative check output</b><br>${esc(c.output)}<br><small>No code was executed.</small></div>`:''}</section><section aria-label="Student and tutor conversation"><div class="chat-title">Conversation </div>${state.step>=1?chatTurn('Student',c.question,'context'):'<p class="quiet">No message at this step. Use Next demo step to reveal the conversation.</p>'}${state.step>=2?chatTurn('Tutor',c.tutor,'tutor'):''}${state.step>=3?'<p class="quiet">The example student edits the notebook without sending another chat message.</p>':''}</section></div><p class="note">${info}<span>Step through the authored sequence to try the layout. This does not generate replies, execute a notebook, or apply your instruction draft.</span></p>`}
function inputPrompt(key,c){if(key==='reference')return 'Authored reference text for this design preview.\nNot a real student record.\nNever supplied as an input to the illustrated simulator.';const history=key==='grounded'?'Earlier student messages:\n'+c.history.join('\n')+'\n\n':'';return 'Role: simulate a student in an introductory programming course.\n\n'+history+'Current student message:\n'+c.question+'\n'+c.before+'\n\nTutor reply:\n'+c.tutor+'\n\nContinue as the student. The reference continuation is not included.'}
function renderInspector(c){const head=`<div class="inspector-title"><span>${state.inspector==='instructions'?'Tutor instructions':'Selected evidence'}</span></div>`;if(state.inspector==='instructions'){$('inspector').innerHTML=head+`<h2>Shape the tutor’s response</h2><p>This controls the tutor, independently of how the simulated student is grounded.</p><label for="policy">Instruction draft</label><textarea id="policy">${esc(state.draft)}</textarea><p class="draft-status" id="draft-status"></p><div class="draft-actions"><button class="primary" id="save-draft">Save demo draft</button><button id="restore-draft">Restore default</button></div><div class="divider"></div><h3>Student simulation</h3><p>The comparison shows illustrative baseline and history-grounded conditions. This tutor draft does not change their examples.</p><p class="tiny" style="margin-top:16px">Stored in this page’s memory only. Reloading resets it; nothing is sent to the backend.</p>`;$('policy').oninput=e=>{state.draft=e.target.value;updateDraftStatus()};$('save-draft').onclick=()=>{state.savedDraft=state.draft;updateDraftStatus();notify('Draft saved for this demo; no run or existing example changed')};$('restore-draft').onclick=()=>{state.draft=defaultPolicy;state.savedDraft=defaultPolicy;renderInspector(c);$('restore-draft').focus();notify('Default demo instructions restored')};updateDraftStatus();return}
const key=state.selected;let title,description,inputs,prompt;
if(key==='reference'){title='Reference example';description='This authored text stands in for a recorded next message. In a real comparison it would remain separate from the simulator’s inputs.';inputs=['Reference visible to the researcher','Not provided to either simulated condition'];prompt=inputPrompt(key,c)}
else if(key==='baseline'||key==='grounded'){const grounded=key==='grounded';title=grounded?'History-grounded example':'Generic baseline example';description=grounded?'Earlier interactions are included alongside the same current exchange. This preview illustrates the input difference.':'A generic student role and the current exchange are supplied, without earlier student messages.';inputs=['Course context','Current student message','Tutor reply',...(grounded?['Two earlier student messages']:[])];prompt=inputPrompt(key,c)}
else if(key==='step'){title=stepNames[state.step];description=state.step>=3?'The authored playback shows work continuing without a new chat message. No notebook code executes in this prototype.':'This is an authored point in the example sequence. Select another step to inspect its work and conversation.';inputs=['Authored notebook state','Visible conversation through this step'];prompt=JSON.stringify({step:state.step+1,event:stepNames[state.step],work:state.step>=3?c.after:c.before,execution:'not run'},null,2)}
else{title=key==='tutor'?'Tutor reply':'Shared source context';description='Both comparison conditions use this same current exchange. The examples do not establish student traits or learning.';inputs=['Authored student message','Authored tutor response'];prompt=c.question+'\n\n'+c.before+'\n\n'+c.tutor}
$('inspector').innerHTML=head+`<span class="tag ${key==='grounded'?'green':''}">Illustrative evidence</span><h2>${title}</h2><p>${description}</p><div class="divider"></div><h3>${key==='reference'?'Source handling':'Available inputs'}</h3><ul class="input-list">${inputs.map(t=>`<li>${check}<span>${t}</span></li>`).join('')}</ul><div class="excluded">${key==='step'?'Playback is authored; no execution result was measured.':'Held-out continuation stays outside generation inputs.'}</div><div class="divider"></div><dl><dt>Case</dt><dd>Example ${c.id}</dd><dt>Origin</dt><dd>Authored</dd><dt>Model calls</dt><dd>None</dd><dt>Evaluation</dt><dd>Not performed</dd></dl><details><summary>View ${key==='step'?'step details':key==='reference'?'source note':'example input'}</summary><pre>${esc(prompt)}</pre></details>`}
function updateDraftStatus(){const dirty=state.draft!==state.savedDraft;$('draft-status').textContent=dirty?'Unsaved demo changes':'Demo draft saved in page memory';$('save-draft').disabled=!dirty||!state.draft.trim();$('instructions').textContent=dirty?'Tutor instructions · Unsaved':'Tutor instructions'}
function renderTrail(){$('playback').hidden=state.mode!=='simulate';if(state.mode!=='simulate'){$('trail').innerHTML='';return}$('trail-title').textContent='Notebook playback';$('trail-hint').textContent=`Step ${state.step+1} of ${stepNames.length} · authored`;$('trail').innerHTML=stepNames.map((title,i)=>`<button data-trail="${i}" aria-pressed="${state.step===i}"><span class="count">${i+1}</span>${title}</button>`).join('');document.querySelectorAll('[data-trail]').forEach(b=>b.onclick=()=>{state.step=Number(b.dataset.trail);state.selected='step';state.inspector='evidence';render();notify('Viewing authored step '+(state.step+1))})}
function render(){const focused=document.activeElement;const focusAttr=['data-case','data-evidence','data-trail'].find(a=>focused?.hasAttribute(a));const focusValue=focusAttr?focused.getAttribute(focusAttr):null;const c=current();renderCases();document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===state.mode)));$('case-title').textContent=c.title;$('view-description').textContent=`Case ${c.id} · ${state.mode==='compare'?'Compare student continuations':state.mode==='simulate'?'Watch notebook work and conversation together':'Inspect the evidence behind a simulation'}`;$('canvas').innerHTML=state.mode==='compare'?renderCompare(c):state.mode==='simulate'?renderSimulate(c):renderInspect(c);$('next-step').hidden=state.mode!=='simulate';$('next-step').disabled=state.step===stepNames.length-1;$('next-step').textContent=state.step===stepNames.length-1?'Demo complete':'Next demo step';$('body-grid').classList.toggle('no-inspector',!state.showInspector);$('body-grid').classList.toggle('inspector-open',state.showInspector);$('inspector-toggle').hidden=!state.showInspector;$('inspector-toggle').textContent='Close details';renderInspector(c);renderTrail();document.querySelectorAll('[data-evidence]').forEach(b=>b.onclick=()=>selectEvidence(b.dataset.evidence));if(focusAttr){if(state.showInspector&&!wideLayout())$('inspector-toggle').focus();else document.querySelector(`[${focusAttr}="${focusValue}"]`)?.focus({preventScroll:true})}}
function openInstructions(){state.inspector='instructions';state.showInspector=true;render();$('policy').focus();notify('Editing a temporary tutor instruction draft')}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>selectMode(b.dataset.mode));
$('search').oninput=renderCases;
$('next-step').onclick=()=>{if(state.step<stepNames.length-1){state.step++;state.selected='step';state.inspector='evidence';render();notify('Authored step '+(state.step+1)+': '+stepNames[state.step])}};
$('instructions').onclick=openInstructions;
$('inspector-toggle').onclick=()=>{state.showInspector=false;render();(state.inspector==='instructions'?$('instructions'):document.querySelector(`[data-evidence="${state.selected}"]`)||document.querySelector(`[data-mode="${state.mode}"]`))?.focus()};
$('explorer-toggle').onclick=()=>{const shown=$('app').classList.toggle('show-explorer');$('explorer-toggle').setAttribute('aria-expanded',String(shown))};
$('reset').onclick=()=>{Object.assign(state,{caseIndex:0,mode:'compare',selected:'context',step:2,inspector:'evidence',showInspector:false,draft:defaultPolicy,savedDraft:defaultPolicy});$('search').value='';$('instructions').textContent='Tutor instructions';render();notify('Demo reset; all examples restored')};
render();notify('Comparing authored examples · backend disconnected');
</script>
</body>
</html>
