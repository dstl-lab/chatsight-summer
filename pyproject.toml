[project]
name = "learner-agents"
version = "0.1.0"
description = "Learner-agent simulation grounded in ChatSight-labeled tutoring logs"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.2",
    "numpy>=2.4.4",
    "scikit-learn>=1.8.0",
    # labeling subsystem: raw-log DB (read-only, via kubectl tunnel) + Gemini classifier
    "psycopg2-binary>=2.9.11",
    "google-genai>=1.66.0",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[project.scripts]
label-loop = "src.labeling.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
