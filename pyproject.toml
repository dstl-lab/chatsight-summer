[project]
name = "learner-agents"
version = "0.1.0"
description = "Learner-agent simulation grounded in ChatSight-labeled tutoring logs"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.2",
    "numpy>=2.4.4",
    "scikit-learn>=1.8.0",
    # labeling subsystem: raw-log DB (read-only, via kubectl tunnel) + Gemini classifier
    "psycopg2-binary>=2.9.11",
    "google-genai>=1.66.0",
    "sqlalchemy>=2.0",
    # labeling web UI (localhost-only instructor surface)
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "httpx>=0.27",
]

[project.scripts]
label-loop = "src.labeling.cli:main"
label-loop-web = "src.labeling.webapp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
